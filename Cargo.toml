[workspace]
members = ["crates/core", "crates/cli", "crates/wasm", "tools/build_catalog"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

# Versions are declared once here; crates opt in with `dep.workspace = true`.
# The approved set is listed in docs/SPEC.md -- ask before adding to it.
[workspace.dependencies]
tracker-core = { path = "crates/core" }
nalgebra = "0.35"
# default-features = false drops rand's sys_rng/thread_rng, and with them the
# getrandom dependency. docs/SPEC.md forbids OS entropy outright -- every seed must
# be explicit -- so this makes that rule a compile error rather than a
# convention, and is also what lets the crate build for wasm32-unknown-unknown.
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"
rand_distr = { version = "0.6", default-features = false, features = ["std"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
bincode = { version = "2.0", features = ["serde"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
criterion = "0.8"
proptest = "1.11"
libm = "0.2"

# The per-frame and 1000-trial budgets in docs/SPEC.md are measured on this profile.
[profile.release]
lto = true
codegen-units = 1
